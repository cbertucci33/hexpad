name: Hexpad
options:
  bundleIdPrefix: com.hexpad
  deploymentTarget:
    macOS: "14.0"
targets:
  Hexpad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Hexpad
      - path: Resources
        buildPhase: resources
      # Liquid Glass icon package (Xcode 26 compiles .icon via actool;
      # ASSETCATALOG_COMPILER_APPICON_NAME points at the package name)
      - path: Hexpad.icon
        buildPhase: resources
    dependencies:
      - package: HexpadKit
        product: HexpadKit
    settings:
      base:
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: Hexpad
        MACOSX_DEPLOYMENT_TARGET: 14.0
        PRODUCT_BUNDLE_IDENTIFIER: com.hexpad.Hexpad
        GENERATE_INFOPLIST_FILE: YES
        # Xcode regenerates the version keys from these when
        # GENERATE_INFOPLIST_FILE is on; without them the built Info.plist
        # drops CFBundleShortVersionString / CFBundleVersion entirely.
        # 1.0 is the product version and there is no build-number scheme.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Carmen Bertucci. All rights reserved."
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Hexpad/Hexpad.entitlements
    info:
      path: Hexpad-Info.plist
      properties:
        # Export compliance: HashKit uses only CryptoKit standard digests (MD5/SHA),
        # which are exempt; no non-exempt encryption is used.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Carmen Bertucci. All rights reserved."
        CFBundleDocumentTypes:
          # public.data removed from Editor claims: generic/binary files remain openable
          # via the All Files viewer entry + explicit Open With. NSServices matches this
          # narrowed text/source set.
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.utf8-plain-text, public.text, public.source-code, public.script, public.python-script, public.swift-source, public.shell-script, public.json, public.xml]
          - CFBundleTypeName: All Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
        # Finder right-click → Services → Open in Hexpad. AppKit routes the
        # selected files to HexpadAppDelegate.openInHexpad(_:userData:error:)
        # through NSApp.servicesProvider (set in applicationWillFinishLaunching).
        # The UTIs mirror the text/source entries above; public.data and
        # public.item are deliberately omitted so the service does not appear
        # for binary files the editor cannot decode.
        NSServices:
          - NSMenuItem:
              default: Open in Hexpad
            NSMessage: openInHexpad
            NSPortName: $(PRODUCT_NAME)
            NSSendFileTypes:
              - public.plain-text
              - public.utf8-plain-text
              - public.text
              - public.source-code
              - public.script
              - public.python-script
              - public.swift-source
              - public.shell-script
              - public.json
              - public.xml
    preBuildScripts:
      - name: "Validate Swift Package"
        script: |
          echo "HexpadKit is provided by the Swift Package Manager at $(pwd)/.."
        executionPosition: before
        basedOnDependencyAnalysis: false
  HexpadAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HexpadAppTests
    dependencies:
      - target: Hexpad
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hexpad.app/Contents/MacOS/Hexpad"

packages:
  HexpadKit:
    path: .
