name: Hexpad
options:
  bundleIdPrefix: com.hexpad
  deploymentTarget:
    macOS: "14.0"
targets:
  Hexpad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Hexpad
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: HexpadKit
        product: HexpadKit
    settings:
      base:
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: 14.0
        PRODUCT_BUNDLE_IDENTIFIER: com.hexpad.Hexpad
        GENERATE_INFOPLIST_FILE: YES
        # Xcode regenerates the version keys from these when
        # GENERATE_INFOPLIST_FILE is on; without them the built Info.plist
        # drops CFBundleShortVersionString / CFBundleVersion entirely.
        # 1.0 is the product version and there is no build-number scheme.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Carmen Bertucci. All rights reserved."
    info:
      path: Hexpad-Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Carmen Bertucci. All rights reserved."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.utf8-plain-text, public.text, public.source-code, public.script, public.python-script, public.swift-source, public.shell-script, public.json, public.xml, public.data]
          - CFBundleTypeName: All Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
    preBuildScripts:
      - name: "Validate Swift Package"
        script: |
          echo "HexpadKit is provided by the Swift Package Manager at $(pwd)/.."
        executionPosition: before
        basedOnDependencyAnalysis: false
  HexpadAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HexpadAppTests
    dependencies:
      - target: Hexpad
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hexpad.app/Contents/MacOS/Hexpad"

packages:
  HexpadKit:
    path: .
